<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud</title>
<style>
  :root{
    --sky-deep:#325A7C;
    --sky-mid:#5487AC;
    --sky-light:#84B2D6;
    --baby:#A9DEFF;
    --baby-dim:rgba(169,222,255,0.62);
    --baby-faint:rgba(169,222,255,0.18);
    --surface:rgba(14,32,50,0.40);
    --surface-strong:rgba(10,24,38,0.72);
    --surface-border:rgba(169,222,255,0.16);
    --glow-black:rgba(0,0,0,0.38);
    --r-sm:10px;
    --r-md:16px;
    --r-lg:22px;
    --r-full:999px;
    box-sizing:border-box;
  }
  *{box-sizing:inherit; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color:var(--baby);
    background:linear-gradient(180deg, var(--sky-deep) 0%, var(--sky-mid) 55%, var(--sky-light) 100%);
    min-height:100vh;
    overflow-x:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  ::selection{background:var(--baby); color:var(--sky-deep);}

  /* ---------- animated clouds ---------- */
  .clouds-layer{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .cloud{
    position:absolute;
    background:#eef7ff;
    border-radius:50%;
    opacity:0.5;
    filter:blur(0.5px);
  }
  .cloud::before, .cloud::after{
    content:"";
    position:absolute;
    background:inherit;
    border-radius:50%;
  }
  .cloud::before{ width:60%; height:100%; top:-40%; left:8%; }
  .cloud::after{ width:75%; height:120%; top:-55%; right:6%; }

  @keyframes drift{
    from{ transform:translateX(-25vw); }
    to{ transform:translateX(125vw); }
  }

  /* ---------- layout shell ---------- */
  .app{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  header.topbar{
    display:flex;
    align-items:center;
    gap:20px;
    padding:16px 28px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:1.35rem;
    font-weight:700;
    letter-spacing:0.02em;
    color:var(--baby);
  }
  .brand svg{ width:30px; height:30px; }

  nav.tabs{
    display:flex;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--surface-border);
    padding:5px;
    border-radius:var(--r-full);
    backdrop-filter:blur(10px);
  }
  .tab-btn{
    display:flex;
    align-items:center;
    gap:7px;
    border:none;
    background:transparent;
    color:var(--baby-dim);
    font-size:0.92rem;
    font-weight:600;
    padding:9px 18px;
    border-radius:var(--r-full);
    cursor:pointer;
    transition:background .18s ease, color .18s ease, box-shadow .18s ease, transform .12s ease;
  }
  .tab-btn svg{ width:17px; height:17px; }
  .tab-btn:hover{
    color:var(--baby);
    box-shadow:0 6px 14px var(--glow-black);
    transform:translateY(-1px);
  }
  .tab-btn.active{
    background:var(--baby-faint);
    color:var(--baby);
    box-shadow:0 6px 14px var(--glow-black);
  }

  .search-wrap{
    flex:1 1 220px;
    max-width:420px;
    display:flex;
    align-items:center;
    gap:9px;
    background:var(--surface);
    border:1px solid var(--surface-border);
    border-radius:var(--r-full);
    padding:10px 18px;
    backdrop-filter:blur(10px);
    transition:box-shadow .18s ease;
  }
  .search-wrap:focus-within{ box-shadow:0 6px 14px var(--glow-black); }
  .search-wrap svg{ width:17px; height:17px; flex-shrink:0; color:var(--baby-dim); }
  .search-wrap input{
    background:none;
    border:none;
    outline:none;
    color:var(--baby);
    font-size:0.95rem;
    width:100%;
  }
  .search-wrap input::placeholder{ color:var(--baby-dim); }

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    text-align:center;
    padding:46px 20px 30px;
    overflow:hidden;
  }
  .hero h1{
    font-size:clamp(2.6rem, 7vw, 4.6rem);
    font-weight:800;
    letter-spacing:0.01em;
    color:var(--baby);
    text-shadow:0 8px 28px var(--glow-black);
  }
  .hero p{
    margin-top:8px;
    color:var(--baby-dim);
    font-size:1rem;
  }

  /* ---------- main content ---------- */
  main{
    flex:1;
    padding:10px 28px 140px;
    max-width:920px;
    width:100%;
    margin:0 auto;
  }
  main h2{
    font-size:1.25rem;
    margin:18px 4px 14px;
    color:var(--baby);
    font-weight:700;
  }

  .song-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .pill{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--surface);
    border:1px solid var(--surface-border);
    border-radius:var(--r-lg);
    padding:10px 14px;
    backdrop-filter:blur(10px);
    cursor:pointer;
    transition:box-shadow .18s ease, transform .12s ease, background .18s ease;
  }
  .pill:hover{
    box-shadow:0 10px 22px var(--glow-black);
    transform:translateY(-2px);
    background:rgba(14,32,50,0.55);
  }
  .pill.playing{
    box-shadow:0 10px 24px var(--glow-black);
    background:rgba(169,222,255,0.10);
  }

  .pill-art{
    width:54px;
    height:54px;
    flex-shrink:0;
    border-radius:var(--r-md);
    background:var(--surface-strong);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .pill-art svg{ width:24px; height:24px; color:var(--baby); }
  .pill-art img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:var(--r-md);
    display:block;
  }

  .pill-info{
    flex:1;
    min-width:0;
  }
  .pill-title{
    font-size:0.98rem;
    font-weight:700;
    color:var(--baby);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pill-artist{
    font-size:0.85rem;
    color:var(--baby-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .pill-duration{
    font-size:0.82rem;
    color:var(--baby-dim);
    flex-shrink:0;
    display:none;
  }
  @media(min-width:560px){ .pill-duration{ display:block; } }

  .icon-btn{
    background:transparent;
    border:none;
    color:var(--baby-dim);
    width:34px;
    height:34px;
    border-radius:var(--r-full);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:box-shadow .18s ease, color .18s ease, background .18s ease, transform .12s ease;
  }
  .icon-btn:hover{
    color:var(--baby);
    background:var(--baby-faint);
    box-shadow:0 6px 14px var(--glow-black);
    transform:translateY(-1px);
  }
  .icon-btn svg{ width:18px; height:18px; }
  .icon-btn.toggled{
    color:var(--baby);
    background:var(--baby-faint);
    box-shadow:0 6px 14px var(--glow-black);
  }
  .icon-btn:disabled{
    opacity:0.35;
    cursor:default;
    pointer-events:none;
  }

  .play-glyph{ flex-shrink:0; }

  /* ---------- dropdown menu ---------- */
  .menu-wrap{ position:relative; }
  .dropdown{
    position:absolute;
    right:0;
    bottom:calc(100% + 6px);
    background:var(--surface-strong);
    border:1px solid var(--surface-border);
    border-radius:var(--r-md);
    padding:6px;
    min-width:170px;
    box-shadow:0 14px 30px var(--glow-black);
    backdrop-filter:blur(14px);
    z-index:20;
    display:none;
  }
  .dropdown.open{ display:block; }
  .dropdown button{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    background:none;
    border:none;
    color:var(--baby);
    font-size:0.9rem;
    font-weight:600;
    padding:10px 12px;
    border-radius:var(--r-sm);
    cursor:pointer;
    text-align:left;
    transition:background .15s ease;
  }
  .dropdown button:hover{ background:var(--baby-faint); }
  .dropdown svg{ width:16px; height:16px; flex-shrink:0; }

  .empty-state{
    text-align:center;
    color:var(--baby-dim);
    padding:50px 20px;
    font-size:0.95rem;
  }

  /* ---------- player bar ---------- */
  .player-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:10;
    background:var(--surface-strong);
    border-top:1px solid var(--surface-border);
    backdrop-filter:blur(16px);
    padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));
  }
  .player-inner{
    max-width:920px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .now-playing{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
    flex:1 1 160px;
  }
  .now-art{
    width:46px; height:46px;
    border-radius:var(--r-md);
    background:rgba(169,222,255,0.08);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .now-art svg{ width:20px; height:20px; color:var(--baby); }
  .now-art img{ width:100%; height:100%; object-fit:cover; border-radius:var(--r-md); }
  .now-text{ min-width:0; }
  .now-title{ font-size:0.9rem; font-weight:700; color:var(--baby); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now-artist{ font-size:0.78rem; color:var(--baby-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .transport{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    flex:1.4 1 220px;
  }
  .transport-controls{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .play-main{
    width:42px; height:42px;
    border-radius:var(--r-full);
    background:var(--baby);
    color:var(--sky-deep);
  }
  .play-main:hover{ box-shadow:0 8px 18px var(--glow-black); }
  .play-main svg{ width:18px; height:18px; }

  .progress-row{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    max-width:420px;
    font-size:0.7rem;
    color:var(--baby-dim);
  }
  .progress-track{
    flex:1;
    height:5px;
    border-radius:var(--r-full);
    background:rgba(169,222,255,0.16);
    cursor:pointer;
    position:relative;
  }
  .progress-fill{
    height:100%;
    border-radius:var(--r-full);
    background:var(--baby);
    width:0%;
  }

  .volume-wrap{
    display:none;
    align-items:center;
    gap:8px;
    flex:1 1 120px;
    justify-content:flex-end;
  }
  @media(min-width:640px){ .volume-wrap{ display:flex; } }
  .volume-wrap svg{ width:17px; height:17px; color:var(--baby-dim); flex-shrink:0; }
  .volume-wrap input[type="range"]{
    -webkit-appearance:none;
    width:90px;
    height:5px;
    border-radius:var(--r-full);
    background:rgba(169,222,255,0.16);
    outline:none;
  }
  .volume-wrap input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px; height:13px;
    border-radius:50%;
    background:var(--baby);
    cursor:pointer;
  }

  /* ---------- track fx (bass & volume boost) ---------- */
  .fx-wrap{ position:relative; flex-shrink:0; }
  .fx-panel{
    position:absolute;
    right:0;
    bottom:calc(100% + 10px);
    background:var(--surface-strong);
    border:1px solid var(--surface-border);
    border-radius:var(--r-lg);
    padding:18px 18px 14px;
    width:240px;
    max-width:calc(100vw - 32px);
    box-shadow:0 16px 34px var(--glow-black);
    backdrop-filter:blur(14px);
    z-index:25;
    display:none;
  }
  .fx-panel.open{ display:block; }
  .fx-panel h3{
    font-size:0.85rem;
    font-weight:700;
    color:var(--baby);
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .fx-panel h3 svg{ width:16px; height:16px; flex-shrink:0; }
  .fx-row{ margin-bottom:16px; }
  .fx-row:last-child{ margin-bottom:0; }
  .fx-row-label{
    display:flex;
    justify-content:space-between;
    font-size:0.78rem;
    color:var(--baby-dim);
    margin-bottom:8px;
  }
  .fx-row-label .fx-value{ color:var(--baby); font-weight:700; }

  .fx-slider{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:5px;
    border-radius:var(--r-full);
    background:rgba(169,222,255,0.16);
    outline:none;
    cursor:pointer;
    transition:box-shadow .2s ease;
  }
  .fx-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:15px; height:15px;
    border-radius:50%;
    background:var(--baby);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 0 0 0 rgba(169,222,255,0.45);
  }
  .fx-slider::-moz-range-thumb{
    width:15px; height:15px;
    border-radius:50%;
    background:var(--baby);
    border:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .fx-slider:hover::-webkit-slider-thumb{ transform:scale(1.15); }
  .fx-slider:hover::-moz-range-thumb{ transform:scale(1.15); }
  .fx-slider.dragging::-webkit-slider-thumb{
    transform:scale(1.35);
    animation:fxPulse 0.9s ease-in-out infinite;
  }
  .fx-slider.dragging::-moz-range-thumb{
    transform:scale(1.35);
  }
  @keyframes fxPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(169,222,255,0.45); }
    50%{ box-shadow:0 0 0 9px rgba(169,222,255,0); }
  }

  @media(max-width:640px){
    header.topbar{ padding:12px 16px; }
    main{ padding:10px 16px 150px; }
    .hero{ padding:30px 14px 20px; }
    .now-text{ display:none; }
    .player-inner{ gap:8px; }
  }
</style>
</head>
<body>

<div class="clouds-layer" id="cloudsLayer"></div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
      <span>Cloud</span>
    </div>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5"/>
          <path d="M5 9.5V21h14V9.5"/>
        </svg>
        Home
      </button>
      <button class="tab-btn" data-tab="favorites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2.5 15.09 9 22 9.9 17 14.6 18.18 21.5 12 18.1 5.82 21.5 7 14.6 2 9.9 8.91 9"/>
        </svg>
        Favorites
      </button>
    </nav>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Search songs or artists">
    </div>
  </header>

  <section class="hero" id="heroSection">
    <h1>Cloud</h1>
    <p id="heroSubtitle">Your music, floating up top.</p>
  </section>

  <main>
    <h2 id="listHeading">All songs</h2>
    <div class="song-list" id="songList"></div>
  </main>

  <div class="player-bar">
    <div class="player-inner">
      <div class="now-playing">
        <div class="now-art" id="nowArt">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <div class="now-text">
          <div class="now-title" id="nowTitle">Nothing playing</div>
          <div class="now-artist" id="nowArtist">Pick a song below</div>
        </div>
      </div>

      <div class="transport">
        <div class="transport-controls">
          <button class="icon-btn" id="prevBtn" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>
            </svg>
          </button>
          <button class="icon-btn play-main" id="playBtn" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <polygon points="6 3 20 12 6 21 6 3"/>
            </svg>
          </button>
          <button class="icon-btn" id="nextBtn" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>
            </svg>
          </button>
          <button class="icon-btn" id="repeatBtn" aria-label="Repeat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 2l4 4-4 4"/>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <path d="M7 22l-4-4 4-4"/>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
          </button>
        </div>
        <div class="progress-row">
          <span id="curTime">0:00</span>
          <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span id="durTime">0:00</span>
        </div>
      </div>

      <div class="fx-wrap">
        <button class="icon-btn" id="fxBtn" aria-label="Bass and volume" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="9" width="16" height="10" rx="2"/>
            <circle cx="8.5" cy="14" r="2"/>
            <circle cx="15.5" cy="14" r="2"/>
            <path d="M8 9V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3"/>
          </svg>
        </button>
        <div class="fx-panel" id="fxPanel">
          <h3>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="9" width="16" height="10" rx="2"/>
              <circle cx="8.5" cy="14" r="2"/>
              <circle cx="15.5" cy="14" r="2"/>
              <path d="M8 9V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3"/>
            </svg>
            Track mix
          </h3>
          <div class="fx-row">
            <div class="fx-row-label"><span>Bass</span><span class="fx-value" id="bassValue">5000</span></div>
            <input type="range" class="fx-slider" id="bassSlider" min="1" max="10000" value="5000">
          </div>
          <div class="fx-row">
            <div class="fx-row-label"><span>Volume</span><span class="fx-value" id="boostValue">5000</span></div>
            <input type="range" class="fx-slider" id="boostSlider" min="1" max="10000" value="5000">
          </div>
        </div>
      </div>

      <div class="volume-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <input type="range" id="volumeSlider" min="0" max="100" value="80">
      </div>
    </div>
  </div>

</div>

<audio id="audioEl" crossorigin="anonymous" preload="auto"></audio>

<script>
/* ==================================================================
   ADD YOUR MUSIC HERE — Google Drive (via the official Drive API)
   ------------------------------------------------------------------
   Heads up: Google blocked the old "hotlink" trick (drive.google.com
   /uc?export=download...) for outside websites back in January 2024 —
   that's why your links downloaded/failed instead of playing. It's
   blocked on Google's side and can't be fixed with a different link
   format. The only door still open is Google's official Drive API,
   set up below. One-time setup, about 5 minutes:

   1. Go to https://console.cloud.google.com/ and create a project
      (or use an existing one).
   2. In the search bar, find "Google Drive API" and click Enable.
   3. Go to "APIs & Services" → "Credentials" → "Create Credentials"
      → "API key". Copy the key it gives you.
   4. Click that new API key → under "Application restrictions" pick
      "Websites" and add the domain(s) you'll host this file on
      (e.g. yourname.github.io/*). This stops other people from
      using your key.
   5. Under "API restrictions", restrict the key to "Google Drive API"
      only.
   6. Paste the key into GOOGLE_API_KEY below.
   7. For each song file in Drive: right-click → Share → General
      access → "Anyone with the link" → Viewer.
   8. Paste each file's ID into "src" below (or the full share link —
      either works, the app pulls the ID out automatically).

   {
     title:  "Song Name",     // required
     artist: "Artist Name",   // required
     src:    "FILE_ID_OR_FULL_SHARE_LINK",   // required
     cover:  "FILE_ID_OR_FULL_SHARE_LINK"    // optional, same rules
   }

   Leave "cover" as "" if you don't have art — the app logo shows in
   its place automatically, and once you add a cover it becomes the
   mini artwork.
   ================================================================== */
const GOOGLE_API_KEY = "AIzaSyB937ude7SIaM178EjA2NECp414J7H__6o";

const songs = [
  { title: "Gata Only",     artist: "FloyyMenor & Cris MJ", src: "https://drive.google.com/file/d/1FRtHuaEpKiiBok2qi5wcpv8rQSW_cwZX/view?usp=sharing", cover: "https://up.yimg.com/ib/th/id/OIP.01bEppRyx4DcLnCFEn7sLgHaHa?pid=Api&rs=1&c=1&qlt=95&w=109&h=109" },
  { title: "DEAD OPPS",    artist: "Notti Osama x DD Osama", src: "https://drive.google.com/file/d/1oHEq3wVdNCndkEvW0A5BYr0fUvB8qZj_/view?usp=sharing", cover: "https://tse3.mm.bing.net/th/id/OIP.BxFNG5bDfmlAnvUJJ3nSfgHaHa?r=0&pid=Api&h=220&P=0" },
  { title: "Shot Callin", artist: "YoungBoy Never Broke Again", src: "https://drive.google.com/file/d/1k-ZXqdXbWjHEd_N2icaB-zb-p1xfj2kB/view?usp=sharing", cover: "https://image.mymixtapez.com/albums/274957/cover/0/large" },
  { title: "Let Em Know", artist: "T.I", src: "https://drive.google.com/file/d/1w4I3vW9UsSviT7pzNMmQJ5qiX4m0LGvz/view?usp=sharing", cover: "https://www.thehypefactor.com/wp-content/uploads/2026/01/ti-let_em_know.png" },
  { title: "Is Ya Ready", artist: "Kay Flock", src: "https://drive.google.com/file/d/1lHZbxo-EADQED-rLw3xEUiRb5HQ8743R/view?usp=sharing", cover: "https://assets.audiomack.com/yru_audiomack/c574ee832c6cf73ae8e564034a7f8db611bb4175e0324ed3b69f5807f13f103c.jpeg?width=1000&height=1000&max=true" },
  { title: "Gleesh Place", artist: "King Von", src: "https://drive.google.com/file/d/1a08OI_K53P7iC1IcS-RvCikiA0i7i31b/view?usp=sharing", cover: "https://assets.audiomack.com/king-von/26b045ce38062717a1cdd8c6161fecad7c1a0f52f7b4807e32986b3313c2f7fe.jpeg?width=1000&height=1000&max=true" },
  { title: "Murder On My Mind", artist: "YNW Melly", src: "https://drive.google.com/file/d/1Lsw9Q-CPxvNTElU94kQsiedI2zUAA8kM/view?usp=sharing", cover: "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/54/33/f4/5433f478-01d7-50dc-67c4-9b11fbdfd03c/814908026068.jpg/1200x1200bf-60.jpg" },
  { title: "On Yo Ass", artist: "King Von and G HERBO", src: "https://drive.google.com/file/d/1e-sjsMH1iasZCO6UQR8ReOhw2DqDVKY_/view?usp=sharing", cover: "https://i1.sndcdn.com/artworks-8Ilf70tOfoZgOYdM-FvRBPg-t1080x1080.jpg" }
];

/* Extracts a Drive file ID from either a raw ID or a full share link,
   then builds an official Drive API media URL. This is the endpoint
   Google's Jan 2024 anti-hotlink block does NOT apply to, since it's
   the sanctioned API rather than a scraped docs.google.com link. */
function resolveDriveUrl(value){
  if(!value) return value;
  let id = value;
  const idMatch = value.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || value.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  if(idMatch && idMatch[1]) id = idMatch[1];
  if(!/^[a-zA-Z0-9_-]{10,}$/.test(id)) return value; // not a Drive id/link — use as-is
  return `https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${GOOGLE_API_KEY}`;
}

/* ---------------- state ---------------- */
let favorites = new Set(JSON.parse(localStorage.getItem("cloud_favorites") || "[]"));
let currentTab = "home";
let currentIndex = -1;
let isPlaying = false;

const musicIconSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
</svg>`;
const moreIconSVG = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
  <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
</svg>`;
const starIconSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="12 2.5 15.09 9 22 9.9 17 14.6 18.18 21.5 12 18.1 5.82 21.5 7 14.6 2 9.9 8.91 9"/>
</svg>`;
const starFilledSVG = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
  <polygon points="12 2.5 15.09 9 22 9.9 17 14.6 18.18 21.5 12 18.1 5.82 21.5 7 14.6 2 9.9 8.91 9"/>
</svg>`;
const playIconSVG = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></svg>`;
const pauseIconSVG = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`;

const songList = document.getElementById("songList");
const listHeading = document.getElementById("listHeading");
const searchInput = document.getElementById("searchInput");
const audioEl = document.getElementById("audioEl");

function saveFavorites(){
  localStorage.setItem("cloud_favorites", JSON.stringify([...favorites]));
}

function formatTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

function getVisibleSongs(){
  const query = searchInput.value.trim().toLowerCase();
  let list = songs.map((s,i)=>({...s, idx:i}));
  if(currentTab === "favorites"){
    list = list.filter(s => favorites.has(s.idx));
  }
  if(query){
    list = list.filter(s => s.title.toLowerCase().includes(query) || s.artist.toLowerCase().includes(query));
  }
  return list;
}

function closeAllDropdowns(except){
  document.querySelectorAll(".dropdown.open").forEach(d=>{
    if(d !== except) d.classList.remove("open");
  });
}

function renderList(){
  listHeading.textContent = currentTab === "favorites" ? "Your favorites" : "All songs";
  const visible = getVisibleSongs();
  songList.innerHTML = "";

  if(visible.length === 0){
    const msg = currentTab === "favorites"
      ? "No favorites yet — tap \u2026 on a song and choose Favorite."
      : "No songs match your search.";
    songList.innerHTML = `<div class="empty-state">${msg}</div>`;
    return;
  }

  visible.forEach(song=>{
    const isFav = favorites.has(song.idx);
    const isCurrent = song.idx === currentIndex;

    const pill = document.createElement("div");
    pill.className = "pill" + (isCurrent && isPlaying ? " playing" : "");

    pill.innerHTML = `
      <div class="pill-art">
        ${song.cover ? `<img src="${resolveDriveUrl(song.cover)}" alt="" referrerpolicy="no-referrer">` : musicIconSVG}
      </div>
      <div class="pill-info">
        <div class="pill-title">${song.title}</div>
        <div class="pill-artist">${song.artist}</div>
      </div>
      <div class="pill-duration">${isCurrent ? formatTime(audioEl.duration) : "--:--"}</div>
      <button class="icon-btn play-glyph" data-role="play" title="Play">
        ${(isCurrent && isPlaying) ? pauseIconSVG : playIconSVG}
      </button>
      <div class="menu-wrap">
        <button class="icon-btn" data-role="more" title="More options">${moreIconSVG}</button>
        <div class="dropdown" data-role="dropdown">
          <button data-role="fav-toggle">
            ${isFav ? starFilledSVG : starIconSVG}
            <span>${isFav ? "Unfavorite" : "Favorite"}</span>
          </button>
        </div>
      </div>
    `;

    pill.querySelector('[data-role="play"]').addEventListener("click",(e)=>{
      e.stopPropagation();
      playSong(song.idx);
    });

    pill.addEventListener("click",(e)=>{
      if(e.target.closest('[data-role="more"]') || e.target.closest(".dropdown")) return;
      playSong(song.idx);
    });

    const moreBtn = pill.querySelector('[data-role="more"]');
    const dropdown = pill.querySelector('[data-role="dropdown"]');
    moreBtn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const willOpen = !dropdown.classList.contains("open");
      closeAllDropdowns();
      dropdown.classList.toggle("open", willOpen);
    });

    pill.querySelector('[data-role="fav-toggle"]').addEventListener("click",(e)=>{
      e.stopPropagation();
      if(favorites.has(song.idx)) favorites.delete(song.idx);
      else favorites.add(song.idx);
      saveFavorites();
      dropdown.classList.remove("open");
      renderList();
    });

    songList.appendChild(pill);
  });
}

document.addEventListener("click", ()=> closeAllDropdowns());

/* ---------------- tabs ---------------- */
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentTab = btn.dataset.tab;
    renderList();
  });
});

searchInput.addEventListener("input", renderList);

/* ---------------- playback ---------------- */
const nowArt = document.getElementById("nowArt");
const nowTitle = document.getElementById("nowTitle");
const nowArtist = document.getElementById("nowArtist");
const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const progressFill = document.getElementById("progressFill");
const progressTrack = document.getElementById("progressTrack");
const curTimeEl = document.getElementById("curTime");
const durTimeEl = document.getElementById("durTime");
const volumeSlider = document.getElementById("volumeSlider");

audioEl.volume = 0.8;

/* ---------------- repeat ---------------- */
const repeatBtn = document.getElementById("repeatBtn");
let isRepeat = false;
repeatBtn.addEventListener("click", ()=>{
  isRepeat = !isRepeat;
  audioEl.loop = isRepeat;
  repeatBtn.classList.toggle("toggled", isRepeat);
});

/* ---------------- per-track bass & volume (boombox panel) ---------------- */
let trackSettings = JSON.parse(localStorage.getItem("cloud_track_settings") || "{}");
let audioCtx = null, sourceNode = null, bassFilter = null, boostGain = null;

const fxBtn = document.getElementById("fxBtn");
const fxPanel = document.getElementById("fxPanel");
const bassSlider = document.getElementById("bassSlider");
const boostSlider = document.getElementById("boostSlider");
const bassValueEl = document.getElementById("bassValue");
const boostValueEl = document.getElementById("boostValue");

function ensureAudioGraph(){
  if(audioCtx) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaElementSource(audioEl);
    bassFilter = audioCtx.createBiquadFilter();
    bassFilter.type = "lowshelf";
    bassFilter.frequency.value = 150;
    boostGain = audioCtx.createGain();
    sourceNode.connect(bassFilter).connect(boostGain).connect(audioCtx.destination);
  }catch(err){
    console.warn("Web Audio unavailable:", err);
  }
}

function getTrackSettings(idx){
  return trackSettings[idx] || { bass: 5000, boost: 5000 };
}

function saveTrackSettings(idx, settings){
  trackSettings[idx] = settings;
  localStorage.setItem("cloud_track_settings", JSON.stringify(trackSettings));
}

function applyTrackAudio(idx){
  const s = getTrackSettings(idx);
  if(bassFilter) bassFilter.gain.value = ((s.bass - 5000) / 5000) * 20;   // -20dB .. +20dB, 5000 = neutral
  if(boostGain) boostGain.gain.value = (s.boost / 5000) * 1;              // 0x .. 2x, 5000 = 1x (unity)
}

function refreshFxPanel(idx){
  const s = getTrackSettings(idx);
  bassSlider.value = s.bass;
  boostSlider.value = s.boost;
  bassValueEl.textContent = s.bass;
  boostValueEl.textContent = s.boost;
}

fxBtn.addEventListener("click", (e)=>{
  e.stopPropagation();
  if(fxBtn.disabled) return;
  const willOpen = !fxPanel.classList.contains("open");
  closeAllDropdowns();
  fxPanel.classList.toggle("open", willOpen);
  fxBtn.classList.toggle("toggled", willOpen);
});

document.addEventListener("click", (e)=>{
  if(!e.target.closest(".fx-wrap")){
    fxPanel.classList.remove("open");
    fxBtn.classList.remove("toggled");
  }
});

[bassSlider, boostSlider].forEach(slider=>{
  const isBass = slider === bassSlider;
  slider.addEventListener("input", ()=>{
    if(currentIndex === -1) return;
    const value = parseInt(slider.value, 10);
    const settings = getTrackSettings(currentIndex);
    if(isBass) settings.bass = value; else settings.boost = value;
    saveTrackSettings(currentIndex, settings);
    applyTrackAudio(currentIndex);
    (isBass ? bassValueEl : boostValueEl).textContent = value;
  });
  const addDrag = ()=> slider.classList.add("dragging");
  const removeDrag = ()=> slider.classList.remove("dragging");
  slider.addEventListener("pointerdown", addDrag);
  slider.addEventListener("pointerup", removeDrag);
  slider.addEventListener("pointerleave", removeDrag);
  slider.addEventListener("touchend", removeDrag);
});

function playSong(idx){
  currentIndex = idx;
  const song = songs[idx];
  ensureAudioGraph();
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  audioEl.src = resolveDriveUrl(song.src);
  audioEl.play().catch(()=>{});
  isPlaying = true;
  nowTitle.textContent = song.title;
  nowArtist.textContent = song.artist;
  nowArt.innerHTML = song.cover ? `<img src="${resolveDriveUrl(song.cover)}" alt="" referrerpolicy="no-referrer">` : musicIconSVG;
  playIcon.outerHTML = pauseIconSVG.replace("<svg", '<svg id="playIcon"');
  fxBtn.disabled = false;
  applyTrackAudio(idx);
  refreshFxPanel(idx);
  renderList();
}

function togglePlay(){
  if(currentIndex === -1){
    if(songs.length) playSong(0);
    return;
  }
  if(isPlaying){
    audioEl.pause();
    isPlaying = false;
  } else {
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    audioEl.play().catch(()=>{});
    isPlaying = true;
  }
  syncPlayIcon();
  renderList();
}

function syncPlayIcon(){
  const icon = document.getElementById("playIcon");
  if(!icon) return;
  icon.outerHTML = (isPlaying ? pauseIconSVG : playIconSVG).replace("<svg", '<svg id="playIcon"');
}

playBtn.addEventListener("click", togglePlay);

document.getElementById("nextBtn").addEventListener("click", ()=>{
  if(!songs.length) return;
  const next = (currentIndex + 1 + songs.length) % songs.length;
  playSong(next);
});
document.getElementById("prevBtn").addEventListener("click", ()=>{
  if(!songs.length) return;
  const prev = (currentIndex - 1 + songs.length) % songs.length;
  playSong(prev);
});

audioEl.addEventListener("timeupdate", ()=>{
  if(!audioEl.duration) return;
  const pct = (audioEl.currentTime / audioEl.duration) * 100;
  progressFill.style.width = pct + "%";
  curTimeEl.textContent = formatTime(audioEl.currentTime);
  durTimeEl.textContent = formatTime(audioEl.duration);
});

audioEl.addEventListener("loadedmetadata", ()=>{
  durTimeEl.textContent = formatTime(audioEl.duration);
});

audioEl.addEventListener("ended", ()=>{
  document.getElementById("nextBtn").click();
});

progressTrack.addEventListener("click",(e)=>{
  if(!audioEl.duration) return;
  const rect = progressTrack.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audioEl.currentTime = pct * audioEl.duration;
});

volumeSlider.addEventListener("input", ()=>{
  audioEl.volume = volumeSlider.value / 100;
});

/* ---------------- animated clouds ---------------- */
function buildClouds(){
  const layer = document.getElementById("cloudsLayer");
  const count = 9;
  for(let i=0;i<count;i++){
    const cloud = document.createElement("div");
    cloud.className = "cloud";
    const size = 90 + Math.random()*160;
    const top = Math.random()*90;
    const duration = 70 + Math.random()*90;
    const delay = -Math.random()*duration;
    const opacity = 0.25 + Math.random()*0.35;
    cloud.style.width = size + "px";
    cloud.style.height = (size*0.55) + "px";
    cloud.style.top = top + "%";
    cloud.style.opacity = opacity;
    cloud.style.animation = `drift ${duration}s linear ${delay}s infinite`;
    layer.appendChild(cloud);
  }
}
buildClouds();

/* ---------------- initial render ---------------- */
renderList();
</script>
