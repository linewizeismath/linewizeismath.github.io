<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Game (Snake)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
    body { display: grid; place-items: center; }
    canvas {
      width: min(86vmin, 640px); height: auto; aspect-ratio: 1;
      border: 1px solid rgba(255,255,255,.7); border-radius: 6px;
      box-shadow: 0 0 24px rgba(255,255,255,.18); touch-action: none;
    }
    #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; opacity: .8; }
  </style>
</head>
<body>
  <div id="hud">Score 0 | Best 0 | Arrow keys, WASD or swipe</div>
  <canvas id="c" width="480" height="480"></canvas>

  <script>
    const c = document.getElementById('c');
    const x = c.getContext('2d');
    const hud = document.getElementById('hud');
    const N = 24, S = c.width / N;

    let snake, dir, queue, food, score, best = 0, state = 'ready', acc = 0, last = 0;

    function reset() {
      snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
      dir = { x: 1, y: 0 };
      queue = [];
      score = 0;
      placeFood();
      updateHud();
    }

    function placeFood() {
      do { food = { x: Math.random() * N | 0, y: Math.random() * N | 0 }; }
      while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function updateHud() {
      hud.textContent = 'Score ' + score + ' | Best ' + best + ' | Arrow keys, WASD or swipe';
    }

    function turn(dx, dy) {
      if (state !== 'playing') { if (state === 'over') reset(); state = 'playing'; }
      const ref = queue.length ? queue[queue.length - 1] : dir;
      if ((dx === -ref.x && dy === -ref.y) || (dx === ref.x && dy === ref.y)) return;
      if (queue.length < 3) queue.push({ x: dx, y: dy });
    }

    function step() {
      if (queue.length) dir = queue.shift();
      const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) {
        state = 'over';
        best = Math.max(best, score);
        updateHud();
        return;
      }
      snake.unshift(h);
      if (h.x === food.x && h.y === food.y) { score++; placeFood(); updateHud(); }
      else snake.pop();
    }

    function banner(text, sub) {
      x.fillStyle = 'rgba(0,0,0,.65)';
      x.fillRect(0, 0, c.width, c.height);
      x.fillStyle = '#fff';
      x.textAlign = 'center';
      x.font = 'bold 34px system-ui, sans-serif';
      x.fillText(text, c.width / 2, c.height / 2 - 6);
      x.font = '16px system-ui, sans-serif';
      x.fillStyle = 'rgba(255,255,255,.7)';
      x.fillText(sub, c.width / 2, c.height / 2 + 24);
    }

    function draw() {
      x.fillStyle = '#000';
      x.fillRect(0, 0, c.width, c.height);

      x.fillStyle = 'rgba(255,255,255,.07)';
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) x.fillRect(i * S + S / 2 - 1, j * S + S / 2 - 1, 2, 2);

      x.shadowColor = '#fff';
      x.shadowBlur = 14;
      x.fillStyle = '#fff';
      x.beginPath();
      x.arc(food.x * S + S / 2, food.y * S + S / 2, S * 0.32, 0, Math.PI * 2);
      x.fill();

      snake.forEach((s, i) => {
        x.globalAlpha = Math.max(0.35, 1 - i * 0.02);
        x.fillRect(s.x * S + 2, s.y * S + 2, S - 4, S - 4);
      });
      x.globalAlpha = 1;
      x.shadowBlur = 0;

      if (state === 'ready') banner('SNAKE', 'Press any arrow key to start');
      if (state === 'over') banner('Game over', 'Score ' + score + '. Press a key to play again');
    }

    function loop(t) {
      acc += t - last;
      last = t;
      while (acc > 105) { acc -= 105; if (state === 'playing') step(); }
      draw();
      requestAnimationFrame(loop);
    }

    const keys = {
      ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
      ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
      ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
      ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
    };

    window.addEventListener('keydown', (e) => {
      const k = keys[e.key];
      if (!k) return;
      e.preventDefault();
      turn(k[0], k[1]);
    });

    let tx = 0, ty = 0;
    window.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
      else turn(0, dy > 0 ? 1 : -1);
    }, { passive: true });

    window.addEventListener('click', () => window.focus());

    reset();
    requestAnimationFrame((t) => { last = t; loop(t); });
  </script>
</body>
</html>
