<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KRYPTON</title>
  <meta name="description" content="KRYPTON - search and play games instantly in your browser.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Blackletter font (Google Fonts). To swap it, see README.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Animated background -->
  <canvas id="waves" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="page" id="page">

    <!-- Title + search -->
    <section class="hero">
      <h1 class="title">KRYPTON</h1>

      <div class="search" role="search">
        <svg class="ico search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input
          id="search"
          type="search"
          placeholder="Search A Game."
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="Search A Game">
        <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" hidden>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Games -->
    <section class="games" aria-labelledby="games-heading">
      <div class="section-head">
        <span class="rule" aria-hidden="true"></span>
        <svg class="ico diamond" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2 22 12 12 22 2 12z"/>
        </svg>
        <h2 id="games-heading">Games</h2>
        <span id="games-count" class="count"></span>
        <svg class="ico diamond" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2 22 12 12 22 2 12z"/>
        </svg>
        <span class="rule" aria-hidden="true"></span>
      </div>

      <div id="status" class="status" role="status" aria-live="polite" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="6" x2="10" y1="11" y2="11"/>
          <line x1="8" x2="8" y1="9" y2="13"/>
          <line x1="15" x2="15.01" y1="12" y2="12"/>
          <line x1="18" x2="18.01" y1="10" y2="10"/>
          <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>
        </svg>
        <p id="status-text"></p>
      </div>

      <div id="games-grid" class="grid"></div>
    </section>

    <footer class="footer">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2 22 7v10l-10 5L2 17V7z"/>
        <path d="M9 8v8"/>
        <path d="M9 12l6-4"/>
        <path d="M9 12l6 4"/>
      </svg>
      <span>KRYPTON</span>
    </footer>
  </main>

  <!-- Game player -->
  <div id="player" class="player" hidden role="dialog" aria-modal="true" aria-labelledby="player-title">
    <div class="player-panel">
      <header class="player-bar">
        <div class="player-name">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <line x1="6" x2="10" y1="11" y2="11"/>
            <line x1="8" x2="8" y1="9" y2="13"/>
            <line x1="15" x2="15.01" y1="12" y2="12"/>
            <line x1="18" x2="18.01" y1="10" y2="10"/>
            <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>
          </svg>
          <h3 id="player-title"></h3>
        </div>

        <div class="player-actions">
          <button id="btn-reload" class="icon-btn" type="button" aria-label="Reload game" title="Reload">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
            </svg>
          </button>

          <button id="btn-fullscreen" class="icon-btn" type="button" aria-label="Toggle fullscreen" title="Fullscreen">
            <svg class="ico ico-expand" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
              <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
              <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
              <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
            <svg class="ico ico-shrink" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
              <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
              <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
              <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
            </svg>
          </button>

          <button id="btn-close" class="icon-btn icon-btn--close" type="button" aria-label="Close game" title="Exit">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18"/>
              <path d="m6 6 12 12"/>
            </svg>
          </button>
        </div>
      </header>

      <div id="player-stage" class="player-stage">
        <div id="player-loader" class="loader" hidden><span class="spinner"></span></div>
        <iframe
          id="player-frame"
          title="Game"
          allow="fullscreen; autoplay; gamepad; clipboard-write"
          allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script src="js/waves.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
